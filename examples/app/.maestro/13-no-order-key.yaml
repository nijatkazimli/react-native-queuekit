appId: com.nijatk.queuekitlab
name: Without orderKey later jobs overtake a retrying one
---
- runFlow: subflows/fresh.yaml
- runFlow:
    file: subflows/open-test.yaml
    env:
      TEST: keep-order-orderkey
- runFlow:
    file: subflows/press.yaml
    env:
      LABEL: Without
- tapOn:
    id: tab-events
- extendedWaitUntil:
    visible: "Start order: step 1, step 2, step 3, step 1, step 1"
    timeout: 30000
