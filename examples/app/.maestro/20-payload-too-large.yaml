appId: com.nijatk.queuekitlab
name: maxPayloadBytes rejects big payloads
---
- runFlow: subflows/fresh.yaml
- runFlow:
    file: subflows/open-test.yaml
    env:
      TEST: payload-too-large
- runFlow:
    file: subflows/press.yaml
    env:
      LABEL: Enqueue too large
- assertVisible: ".*over maxPayloadBytes.*"
- tapOn:
    id: tab-dashboard
- assertVisible:
    id: stat-total
    text: "0"
