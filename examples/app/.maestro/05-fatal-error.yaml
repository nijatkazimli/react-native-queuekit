appId: com.nijatk.queuekitlab
name: NonRetryableError gives up at once
---
- runFlow: subflows/fresh.yaml
- runFlow:
    file: subflows/open-test.yaml
    env:
      TEST: fatal-error-no-retry
- runFlow:
    file: subflows/press.yaml
    env:
      LABEL: Fatal error
- tapOn:
    id: tab-queue
- extendedWaitUntil:
    visible:
      id: badge-failed
    timeout: 15000
- assertVisible: ".*400 Bad Request.*"
- tapOn:
    id: tab-events
- assertVisible: ".*failed 1.*"
- assertNotVisible:
    id: badge-retry
