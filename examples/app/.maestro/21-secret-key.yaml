appId: com.nijatk.queuekitlab
name: A secret-looking key is still enqueued (the warning is development only)
---
- runFlow: subflows/fresh.yaml
- runFlow:
    file: subflows/open-test.yaml
    env:
      TEST: secret-in-a-payload
- runFlow:
    file: subflows/press.yaml
    env:
      LABEL: apiToken in payload
- tapOn:
    id: tab-events
- extendedWaitUntil:
    visible: ".*enqueued 1.*"
    timeout: 10000
