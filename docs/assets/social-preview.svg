<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#18224A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#4FC3F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6C8CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6C8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="80" y="96" width="72" height="8" rx="4" fill="url(#accent)"/>

  <text x="80" y="170" fill="#8C97C4" font-size="26" font-weight="600" letter-spacing="1">@nijatk/react-native-queuekit</text>
  <text x="76" y="300" fill="#FFFFFF" font-size="132" font-weight="800" letter-spacing="-3">QueueKit</text>
  <text x="80" y="372" fill="#E8ECFF" font-size="40" font-weight="600">Offline-first job queue</text>
  <text x="80" y="424" fill="#E8ECFF" font-size="40" font-weight="600">for React Native</text>

  <g font-size="24" font-weight="600" fill="#8C97C4">
    <text x="80" y="520">MMKV-backed</text>
    <text x="330" y="520">Retries and backoff</text>
    <text x="80" y="560">Crash recovery</text>
    <text x="330" y="560">Typed, with React hooks</text>
  </g>

  <!-- queue illustration -->
  <g>
    <rect x="740" y="120" width="460" height="132" rx="20" fill="#141B34" stroke="#2A3562" stroke-width="2"/>
    <text x="772" y="170" fill="#E8ECFF" font-size="28" font-weight="700">uploadPhoto</text>
    <rect x="1074" y="146" width="96" height="32" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <text x="1122" y="169" fill="#4FC3F7" font-size="18" font-weight="800" text-anchor="middle">ACTIVE</text>
    <rect x="772" y="204" width="396" height="12" rx="6" fill="#0B1020"/>
    <rect x="772" y="204" width="258" height="12" rx="6" fill="#4FC3F7"/>
  </g>
  <g>
    <rect x="740" y="272" width="460" height="132" rx="20" fill="#141B34" stroke="#2A3562" stroke-width="2"/>
    <text x="772" y="322" fill="#E8ECFF" font-size="28" font-weight="700">syncProfile</text>
    <rect x="1066" y="298" width="104" height="32" rx="8" fill="none" stroke="#FFB020" stroke-width="2"/>
    <text x="1118" y="321" fill="#FFB020" font-size="18" font-weight="800" text-anchor="middle">PENDING</text>
    <text x="772" y="372" fill="#8C97C4" font-size="22" font-weight="600">retry 2 of 5 in 4 s</text>
  </g>
  <g>
    <rect x="740" y="424" width="460" height="132" rx="20" fill="#141B34" stroke="#2A3562" stroke-width="2"/>
    <text x="772" y="474" fill="#E8ECFF" font-size="28" font-weight="700">sendMessage</text>
    <rect x="1066" y="450" width="104" height="32" rx="8" fill="none" stroke="#FFB020" stroke-width="2"/>
    <text x="1118" y="473" fill="#FFB020" font-size="18" font-weight="800" text-anchor="middle">PENDING</text>
    <text x="772" y="524" fill="#8C97C4" font-size="22" font-weight="600">waiting for network</text>
  </g>
</svg>
