name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your app, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: An API sketch is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: A workaround, or another library you tried.
