name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Publish to npm
        run: |
          status=0
          npm publish --access public --provenance > /tmp/publish.log 2>&1 || status=$?
          cat /tmp/publish.log
          if [ "$status" -ne 0 ]; then
            # npm view can lag behind a fresh publish, so detect "already published" from the error.
            grep -q "cannot publish over the previously published" /tmp/publish.log || exit "$status"
            echo "Already on npm, skipping publish"
          fi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
