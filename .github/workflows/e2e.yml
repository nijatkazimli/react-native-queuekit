name: E2E (iOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: "2.12.0"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  # Pull requests run the flows tagged `smoke`; everything else runs all flows split over three simulators.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix=[{"name":"smoke","flows":"--include-tags smoke .maestro"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"name":"1 of 3","flows":".maestro/0*.yaml"},{"name":"2 of 3","flows":".maestro/1*.yaml"},{"name":"3 of 3","flows":".maestro/2*.yaml .maestro/3*.yaml"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/app/package-lock.json
      - run: npm ci
      - name: Install app dependencies
        working-directory: examples/app
        run: npm ci
      # The generated ios/ project and Xcode's build products make later runs incremental.
      - uses: actions/cache@v6
        with:
          path: |
            examples/app/ios
            ~/Library/Developer/Xcode/DerivedData/QueueKitLab-*
          key: ios-build-${{ runner.os }}-${{ hashFiles('examples/app/package-lock.json', 'examples/app/app.json', 'examples/app/package.json') }}
          restore-keys: |
            ios-build-${{ runner.os }}-
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][-1].udid')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - name: Build the Release app
        working-directory: examples/app
        run: |
          npm run build:lib
          npx expo run:ios --configuration Release --no-bundler --device "$UDID"
      - name: Package the app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Release-iphonesimulator/QueueKitLab.app" | head -1)
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/QueueKitLab.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: app-ios
          path: ${{ runner.temp }}/QueueKitLab.zip
          retention-days: 1

  test:
    needs: [plan, build]
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: app-ios
          path: ${{ runner.temp }}
      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][-1].udid')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          ditto -x -k "$RUNNER_TEMP/QueueKitLab.zip" "$RUNNER_TEMP/app"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/app/QueueKitLab.app"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the e2e flows
        working-directory: examples/app
        run: |
          maestro test --device "$UDID" \
            --format junit --output "$RUNNER_TEMP/maestro-report.xml" \
            --debug-output "$RUNNER_TEMP/maestro-debug" ${{ matrix.flows }}
      - name: Summarize the results
        if: always()
        run: node scripts/junit-summary.mjs "$RUNNER_TEMP/maestro-report.xml" "${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-ios-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
          include-hidden-files: true
          if-no-files-found: ignore
